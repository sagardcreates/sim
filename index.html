<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Terrarium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">Terrarium</div>
        <div class="group" id="speeds" role="group" aria-label="Simulation speed"></div>
        <div class="date" id="date">—</div>
        <div class="badges" id="badges"></div>
        <div class="spacer"></div>
        <div class="group" role="group" aria-label="View">
          <button id="view-world" class="active" title="World view">World</button>
          <button id="view-clan" title="Clan view: territories and relations">Clans</button>
          <button id="view-follow" title="Follow the selected person">Follow</button>
        </div>
        <label class="seed">seed <input id="seed" type="number" value="1" min="1" /></label>
        <button id="restart" title="Start a new world with this seed">New world</button>
      </header>
      <main id="stage">
        <div id="canvas-host"></div>
        <div id="bubble" hidden></div>
        <div id="legend"></div>
        <div id="chronicle-overlay" hidden>
          <div class="label">Chronicle mode</div>
          <p>At high speed, people are drawn as clan-colored dots. The timeline and chronicle below keep the history.</p>
        </div>
      </main>
      <aside id="drawer">
        <section id="clans-panel">
          <h2>Clans</h2>
          <div id="clan-list"></div>
        </section>
        <section id="inspector" hidden>
          <div class="panel-head"><h2 id="insp-name">—</h2><button id="insp-close" aria-label="Close inspector">×</button></div>
          <div id="insp-body"></div>
        </section>
        <section id="clan-inspector" hidden>
          <div class="panel-head"><h2 id="clan-name">—</h2><button id="clan-close" aria-label="Close clan panel">×</button></div>
          <div id="clan-body"></div>
        </section>
        <p class="hint" id="hint">Click a person to see what they are doing and why. Click a camp banner or a clan below for its story.</p>
      </aside>
      <footer id="bottom">
        <div id="timeline">
          <div class="tl-head"><span class="label">Population by clan</span><span id="tl-readout"></span></div>
          <canvas id="stream" height="90"></canvas>
          <div class="scrub">
            <input id="scrub" type="range" min="0" max="0" step="10" value="0" aria-label="Jump to year" />
            <span id="scrub-label">Jump to a saved year</span>
          </div>
        </div>
        <div id="ticker-wrap">
          <div class="label">Chronicle</div>
          <ol id="ticker"></ol>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/ui/app.ts"></script>
  </body>
</html>
